// Local storage shim — replaces the Claude-artifact-specific window.storage API
// so the app persists data normally in a real browser / installed PWA.
const storage = {
  async get(key) {
    try {
      const value = localStorage.getItem(key);
      return value !== null ? { key, value } : null;
    } catch {
      return null;
    }
  },
  async set(key, value) {
    try {
      localStorage.setItem(key, value);
      return { key, value };
    } catch {
      return null;
    }
  },
};

const EXPENSE_CATEGORIES = ["Parkering", "BroBizz", "Materialer", "Transport", "Kost", "Andet"];

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function todayISO() {
  return new Date().toISOString().slice(0, 10);
}
function formatDKK(n) {
  return new Intl.NumberFormat("da-DK", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n || 0);
}
function formatHours(n) {
  return formatDKK(n).replace(",00", "");
}
function formatDateDK(iso) {
  const [y, m, d] = iso.split("-");
  return `${d}.${m}.${y}`;
}
function weekdayDK(iso) {
  const days = ["søndag", "mandag", "tirsdag", "onsdag", "torsdag", "fredag", "lørdag"];
  const d = new Date(iso + "T12:00:00");
  return days[d.getDay()];
}
function isoWeek(iso) {
  const d = new Date(iso + "T12:00:00");
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay() + 6) % 7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = new Date(target.getFullYear(), 0, 4);
  const diff = target - firstThursday;
  return 1 + Math.round(diff / (7 * 24 * 3600 * 1000));
}
function timeToMinutes(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}
function computeHoursFromRange(start, end) {
  let diff = timeToMinutes(end) - timeToMinutes(start);
  if (diff < 0) diff += 24 * 60;
  return Math.round((diff / 60) * 100) / 100;
}
function hm(h, m) {
  return (parseFloat(String(h).replace(",", ".")) || 0) + (parseFloat(String(m).replace(",", ".")) || 0) / 60;
}
function decToHM(dec) {
  const h = Math.floor(dec);
  const m = Math.round((dec - h) * 60);
  return { h: h ? String(h) : "", m: m ? String(m) : "" };
}
function vatSplit(amount, rate, inclusive) {
  const amt = amount || 0;
  if (inclusive) {
    const net = amt / (1 + rate / 100);
    return { net, vat: amt - net, gross: amt };
  }
  const vat = amt * (rate / 100);
  return { net: amt, vat, gross: amt + vat };
}
function entryAmount(e) {
  const base = (e.hours || 0) * (e.hourlyRate || 0);
  const nightBonus = (e.nightHours || 0) * (e.nightRate || 0);
  return base + nightBonus;
}
function staffCost(e) {
  const base = (e.hours || 0) * (e.hourlyWage || 0);
  const nightBonus = (e.nightHours || 0) * (e.nightRate || 0);
  return base + nightBonus;
}
function fileToCompressedDataUrl(file, maxDim = 1000, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Kunne ikke læse filen"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Kunne ikke læse billedet"));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

const emptyCustomerForm = { name: "", hourlyRate: "", nightRate: "" };
const emptyEmployeeForm = { name: "", hourlyWage: "", nightRate: "" };

function newStaffRow() {

}

}

function App() {
  const [entries, setEntries] = useState([]);
  const [customers, setCustomers] = useState([]);
  const [jobNames, setJobNames] = useState([]);
  const [employees, setEmployees] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [page, setPage] = useState("registrering"); // registrering | arkiv | eksport

  const [draft, setDraft] = useState(emptyDraft());
  const [editingIds, setEditingIds] = useState(null); // ids of entries currently being edited from arkiv

  const [showTimeModal, setShowTimeModal] = useState(false);
  const [showNightModal, setShowNightModal] = useState(false);
  const [showJobsModal, setShowJobsModal] = useState(false);
  const [showCustomerModal, setShowCustomerModal] = useState(false);
  const [showStaffModal, setShowStaffModal] = useState(false);
  const [showExpensesModal, setShowExpensesModal] = useState(false);
  const [customerForm, setCustomerForm] = useState(emptyCustomerForm);
  const [editingCustomerId, setEditingCustomerId] = useState(null);
  const [employeeForm, setEmployeeForm] = useState(emptyEmployeeForm);
  const [editingEmployeeId, setEditingEmployeeId] = useState(null);
  const [addingEmpFor, setAddingEmpFor] = useState(null); // staff row id currently adding a new employee
  const [newEmpNameInput, setNewEmpNameInput] = useState("");
  const [newEmpWageInput, setNewEmpWageInput] = useState("");
  const [newEmpNightRateInput, setNewEmpNightRateInput] = useState("");
  const [newJobNameInput, setNewJobNameInput] = useState("");
  const [addingJobFor, setAddingJobFor] = useState(null); // row id currently adding a new job name
  const [uploadingReceipt, setUploadingReceipt] = useState(null);
  const [lightboxImage, setLightboxImage] = useState(null);

  const [exportFrom, setExportFrom] = useState("");
  const [exportTo, setExportTo] = useState("");
  const [exportCustomer, setExportCustomer] = useState("Alle");
  const [exportFormat, setExportFormat] = useState("numbers"); // numbers | pdf
  const [exportStatus, setExportStatus] = useState(null);
  const [saveStatus, setSaveStatus] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("entries");
        if (res && res.value) setEntries(JSON.parse(res.value));
      } catch (e) {}
      try {
        const res2 = await storage.get("customers");
        if (res2 && res2.value) setCustomers(JSON.parse(res2.value));
      } catch (e) {}
      try {
        const res3 = await storage.get("jobNames");
        if (res3 && res3.value) setJobNames(JSON.parse(res3.value));
      } catch (e) {}
      try {
        const res4 = await storage.get("employees");
        if (res4 && res4.value) setEmployees(JSON.parse(res4.value));
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);
  useEffect(() => {
    if (!loaded) return;
    storage.set("entries", JSON.stringify(entries)).catch(() => {});
  }, [entries, loaded]);
  useEffect(() => {
    if (!loaded) return;
    storage.set("customers", JSON.stringify(customers)).catch(() => {});
  }, [customers, loaded]);
  useEffect(() => {
    if (!loaded) return;
    storage.set("jobNames", JSON.stringify(jobNames)).catch(() => {});
  }, [jobNames, loaded]);
  useEffect(() => {
    if (!loaded) return;
    storage.set("employees", JSON.stringify(employees)).catch(() => {});
  }, [employees, loaded]);


  // Seed job list from any project names already used historically
  useEffect(() => {
    if (!loaded) return;
    const historical = new Set(entries.filter((e) => e.type === "tid").map((e) => e.project).filter(Boolean));
    setJobNames((prev) => {
      const merged = new Set([...prev, ...historical]);
      if (merged.size === prev.length) return prev;
      return Array.from(merged).sort((a, b) => a.localeCompare(b, "da"));
    });
    // eslint-disable-next-line
  }, [loaded]);

  function addJobName(name) {
    const trimmed = name.trim();
    if (!trimmed) return;
    setJobNames((prev) => (prev.includes(trimmed) ? prev : [...prev, trimmed].sort((a, b) => a.localeCompare(b, "da"))));
  }
  function removeJobName(name) {
    setJobNames((prev) => prev.filter((n) => n !== name));
  }


  function customerName(id) {
    const c = customers.find((x) => x.id === id);
    return c ? c.name : "";
  }

  // ---------- Time computation for the draft ----------
  const totalHours = useMemo(() => {
    if (draft.start && draft.end) return computeHoursFromRange(draft.start, draft.end);
    return hm(draft.manualH, draft.manualM);
  }, [draft.start, draft.end, draft.manualH, draft.manualM]);
  const privateHours = hm(draft.privateH, draft.privateM);
  const arbejdstimer = Math.max(0, Math.round((totalHours - privateHours) * 100) / 100);
  const nightHoursValue = Math.min(hm(draft.nightH, draft.nightM), arbejdstimer);

  const jobsTotal = useMemo(() => draft.jobs.reduce((s, j) => s + hm(j.h, j.m), 0), [draft.jobs]);
  const staffTotalDraft = useMemo(() => draft.staff.reduce((s, x) => s + hm(x.h, x.m), 0), [draft.staff]);
  const validExpensesDraft = useMemo(() => draft.expenses.filter((x) => (parseFloat(String(x.amount).replace(",", ".")) || 0) > 0), [draft.expenses]);
  const expensesTotalDraft = useMemo(() => validExpensesDraft.reduce((s, x) => s + (parseFloat(String(x.amount).replace(",", ".")) || 0), 0), [validExpensesDraft]);

  // ---------- Customers ----------
  function saveCustomer() {
    if (!customerForm.name.trim()) return;
    const payload = {
      name: customerForm.name.trim(),
      hourlyRate: parseFloat(String(customerForm.hourlyRate).replace(",", ".")) || 0,
      nightRate: parseFloat(String(customerForm.nightRate).replace(",", ".")) || 0,
    };
    if (editingCustomerId) {
      setCustomers((prev) => prev.map((c) => (c.id === editingCustomerId ? { ...c, ...payload } : c)));
      setEditingCustomerId(null);
    } else {
      const newCust = { id: uid(), ...payload };
      setCustomers((prev) => [...prev, newCust]);
      setDraft((d) => ({ ...d, customerId: newCust.id, hourlyRate: String(newCust.hourlyRate), nightRate: String(newCust.nightRate) }));
    }
    setCustomerForm(emptyCustomerForm);
  }
  function removeCustomer(id) {
    setCustomers((prev) => prev.filter((c) => c.id !== id));
    if (draft.customerId === id) setDraft((d) => ({ ...d, customerId: "", hourlyRate: "" }));
  }
  function pickCustomer(id) {
    const c = customers.find((x) => x.id === id);
    setDraft((d) => ({ ...d, customerId: id, hourlyRate: c ? String(c.hourlyRate) : d.hourlyRate, nightRate: c ? String(c.nightRate || "") : d.nightRate }));
    setShowCustomerModal(false);
  }

  // ---------- Employees ----------
  function saveEmployee() {
    if (!employeeForm.name.trim()) return;
    const payload = {
      name: employeeForm.name.trim(),
      hourlyWage: parseFloat(String(employeeForm.hourlyWage).replace(",", ".")) || 0,
      nightRate: parseFloat(String(employeeForm.nightRate).replace(",", ".")) || 0,
    };
    if (editingEmployeeId) {
      setEmployees((prev) => prev.map((emp) => (emp.id === editingEmployeeId ? { ...emp, ...payload } : emp)));
      setEditingEmployeeId(null);
    } else {
      setEmployees((prev) => [...prev, { id: uid(), ...payload }]);
    }
    setEmployeeForm(emptyEmployeeForm);
  }
  function addEmployeeName(name, wage, nightRate) {
    const trimmed = name.trim();
    if (!trimmed) return null;
    const existing = employees.find((e) => e.name.toLowerCase() === trimmed.toLowerCase());
    if (existing) return existing.id;
    const newEmp = {
      id: uid(),
      name: trimmed,
      hourlyWage: parseFloat(String(wage).replace(",", ".")) || 0,
      nightRate: parseFloat(String(nightRate).replace(",", ".")) || 0,
    };
    setEmployees((prev) => [...prev, newEmp]);
    return newEmp.id;
  }
  function removeEmployee(id) {
    setEmployees((prev) => prev.filter((emp) => emp.id !== id));
    setDraft((d) => ({ ...d, staff: d.staff.map((s) => (s.employeeId === id ? { ...s, employeeId: "" } : s)) }));
  }
  function updateStaff(id, patch) {
    setDraft((d) => ({ ...d, staff: d.staff.map((s) => (s.id === id ? { ...s, ...patch } : s)) }));
  }
  function addStaffRow() {
    setDraft((d) => ({ ...d, staff: [...d.staff, newStaffRow()] }));
  }
  function removeStaffRow(id) {
    setDraft((d) => ({ ...d, staff: d.staff.length > 1 ? d.staff.filter((s) => s.id !== id) : d.staff }));
  }
  function employeeName(id) {
    const emp = employees.find((x) => x.id === id);
    return emp ? emp.name : "";
  }

  // ---------- Jobs modal ----------
  function updateJob(id, patch) {
    setDraft((d) => ({ ...d, jobs: d.jobs.map((j) => (j.id === id ? { ...j, ...patch } : j)) }));
  }
  function addJobRow() {
    setDraft((d) => ({ ...d, jobs: [...d.jobs, newJobRow()] }));
  }
  function removeJobRow(id) {
    setDraft((d) => ({ ...d, jobs: d.jobs.length > 1 ? d.jobs.filter((j) => j.id !== id) : d.jobs }));
  }

  // ---------- Expenses ----------
  function updateExpense(id, patch) {
    setDraft((d) => ({ ...d, expenses: d.expenses.map((x) => (x.id === id ? { ...x, ...patch } : x)) }));
  }
  function addExpenseRow() {
    setDraft((d) => ({ ...d, expenses: [...d.expenses, newExpenseRow()] }));
  }
  function removeExpenseRow(id) {
    setDraft((d) => ({ ...d, expenses: d.expenses.length > 1 ? d.expenses.filter((x) => x.id !== id) : d.expenses }));
  }
  async function handleReceiptSelect(id, file) {
    if (!file) return;
    setUploadingReceipt(id);
    try {
      const dataUrl = await fileToCompressedDataUrl(file);
      updateExpense(id, { receiptImage: dataUrl });
    } catch (e) {
    } finally {
      setUploadingReceipt(null);
    }
  }

  // ---------- Save registration ----------
  function saveRegistration() {
    const validJobs = draft.jobs.filter((j) => j.project.trim() && hm(j.h, j.m) > 0);
    const rate = parseFloat(String(draft.hourlyRate).replace(",", ".")) || 0;
    const nightRateVal = parseFloat(String(draft.nightRate).replace(",", ".")) || 0;
    let remainingNightHours = nightHoursValue;
    const generalNote = draft.note.trim();
    const newTidEntries = validJobs.map((j, i) => {
      const jobHours = hm(j.h, j.m);
      const nightForThisJob = Math.min(remainingNightHours, jobHours);
      remainingNightHours = Math.max(0, remainingNightHours - nightForThisJob);
      return {
        id: uid(),
        type: "tid",
        date: draft.date,
        customerId: draft.customerId,
        hourlyRate: rate,
        nightRate: nightRateVal,
        nightHours: Math.round(nightForThisJob * 100) / 100,
        project: j.project.trim(),
        hours: jobHours,
        note: i === 0 && generalNote ? [j.note.trim(), generalNote].filter(Boolean).join(" — ") : j.note.trim(),
      };
    });
    const validExpenses = draft.expenses.filter((x) => (parseFloat(String(x.amount).replace(",", ".")) || 0) > 0);
    const newUdlaegEntries = validExpenses.map((x, i) => ({
      id: uid(),
      type: "udlaeg",
      date: draft.date,
      customerId: draft.customerId,
      amount: parseFloat(String(x.amount).replace(",", ".")),
      vatRate: parseFloat(x.vatRate) || 0,
      vatIncl: x.vatIncl,
      category: x.category,
      note: validJobs.length === 0 && i === 0 && generalNote ? [x.note.trim(), generalNote].filter(Boolean).join(" — ") : x.note.trim(),
      receiptImage: x.receiptImage || null,
    }));
    const validStaff = draft.staff.filter((s) => s.employeeId && hm(s.h, s.m) > 0);
    const newStaffEntries = validStaff.map((s) => {
      const emp = employees.find((x) => x.id === s.employeeId);
      const staffHours = hm(s.h, s.m);
      const staffNightHours = Math.min(hm(s.nightH, s.nightM), staffHours);
      return {
        id: uid(),
        type: "personale",
        date: draft.date,
        customerId: draft.customerId,
        employeeId: s.employeeId,
        hourlyWage: emp ? emp.hourlyWage : 0,
        nightRate: emp ? emp.nightRate : 0,
        hours: staffHours,
        nightHours: Math.round(staffNightHours * 100) / 100,
        note: s.note.trim(),
      };
    });
    if (newTidEntries.length === 0 && newUdlaegEntries.length === 0 && newStaffEntries.length === 0) return;

    if (editingIds) {
      setEntries((prev) => [
        ...prev.filter((e) => !editingIds.includes(e.id)),
        ...newTidEntries,
        ...newUdlaegEntries,
        ...newStaffEntries,
      ]);
      setEditingIds(null);
    } else {
      setEntries((prev) => [...newTidEntries, ...newUdlaegEntries, ...newStaffEntries, ...prev]);
    }
    setDraft({ ...emptyDraft(), customerId: draft.customerId, hourlyRate: draft.hourlyRate, date: draft.date });
    setPage("registrering");
    setSaveStatus("Registrering gemt ✓ — se den under Arkiv. Landingssiden er ryddet til en ny registrering.");
    setTimeout(() => setSaveStatus(null), 5000);
  }

  function editRegistration(date, customerId) {
    const group = entries.filter((e) => e.date === date && (e.customerId || "") === (customerId || ""));
    const tidGroup = group.filter((e) => e.type === "tid");
    const udlaegGroup = group.filter((e) => e.type === "udlaeg");
    const staffGroup = group.filter((e) => e.type === "personale");
    const totalNightHours = tidGroup.reduce((s, e) => s + (e.nightHours || 0), 0);
    const { h: nightH, m: nightM } = decToHM(totalNightHours);
    setDraft({
      customerId: customerId || "",
      hourlyRate: tidGroup[0] ? String(tidGroup[0].hourlyRate ?? "") : "",
      nightRate: tidGroup[0] && tidGroup[0].nightRate ? String(tidGroup[0].nightRate) : "",
      nightH,
      nightM,
      date,
      start: "",
      end: "",
      manualH: "",
      manualM: "",
      privateH: "",
      privateM: "",
      jobs: tidGroup.length
        ? tidGroup.map((e) => { const { h, m } = decToHM(e.hours); return { id: e.id, project: e.project, h, m, note: e.note || "" }; })
        : [newJobRow()],
      staff: staffGroup.length
        ? staffGroup.map((e) => {
            const { h, m } = decToHM(e.hours);
            const { h: nh, m: nm } = decToHM(e.nightHours || 0);
            return { id: e.id, employeeId: e.employeeId, h, m, nightH: nh, nightM: nm, note: e.note || "" };
          })
        : [newStaffRow()],
      expenses: udlaegGroup.length
        ? udlaegGroup.map((e) => ({ id: e.id, category: e.category, amount: String(e.amount), vatRate: String(e.vatRate ?? 25), vatIncl: e.vatIncl !== false, note: e.note || "", receiptImage: e.receiptImage || null }))
        : [newExpenseRow()],
      note: "",
    });
    setEditingIds(group.map((e) => e.id));
    setPage("registrering");
  }

  function deleteRegistration(date, customerId) {
    setEntries((prev) => prev.filter((e) => !(e.date === date && (e.customerId || "") === (customerId || ""))));
  }

  // ---------- Arkiv grouping ----------
  const archiveGroups = useMemo(() => {
    const map = {};
    entries.forEach((e) => {
      const key = `${e.date}__${e.customerId || ""}`;
      if (!map[key]) map[key] = { date: e.date, customerId: e.customerId || "", tid: [], udlaeg: [], personale: [] };
      if (e.type === "tid") map[key].tid.push(e);
      else if (e.type === "personale") map[key].personale.push(e);
      else map[key].udlaeg.push(e);
    });
    return Object.values(map).sort((a, b) => (a.date < b.date ? 1 : -1));
  }, [entries]);

  // ---------- Export ----------
  const exportEntries = useMemo(() => {
    return entries.filter((e) => {
      if (exportFrom && e.date < exportFrom) return false;
      if (exportTo && e.date > exportTo) return false;
      if (exportCustomer !== "Alle" && (e.customerId || "") !== exportCustomer) return false;
      return true;
    });
  }, [entries, exportFrom, exportTo, exportCustomer]);

  const exportByDate = useMemo(() => {
    const map = {};
    exportEntries.forEach((e) => {
      if (!map[e.date]) map[e.date] = { tid: [], udlaeg: [], personale: [] };
      if (e.type === "tid") map[e.date].tid.push(e);
      else if (e.type === "personale") map[e.date].personale.push(e);
      else map[e.date].udlaeg.push(e);
    });
    return Object.keys(map).sort((a, b) => (a < b ? -1 : 1)).map((date) => ({ date, ...map[date] }));
  }, [exportEntries]);

  async function exportXlsx() {
    const tid = exportEntries.filter((e) => e.type === "tid");
    const udlaeg = exportEntries.filter((e) => e.type === "udlaeg");
    const personale = exportEntries.filter((e) => e.type === "personale");

    const wb = XLSX.utils.book_new();
    const tidRows = [
      ["Dato", "Ugedag", "Kunde", "Job/projekt", "Timer", "Timesats", "Nattetimer", "Nattillæg/t", "Beløb", "Note"],
      ...tid.sort((a, b) => (a.date < b.date ? -1 : 1)).map((e) => [
        formatDateDK(e.date), weekdayDK(e.date), customerName(e.customerId), e.project, e.hours,
        e.hourlyRate || 0, e.nightHours || 0, e.nightRate || 0, Number(entryAmount(e).toFixed(2)), e.note,
      ]),
      [],
      ["", "", "", "I alt", Number(tid.reduce((s, e) => s + e.hours, 0).toFixed(2)), "", "", "", Number(tid.reduce((s, e) => s + entryAmount(e), 0).toFixed(2)), ""],
    ];
    const wsTid = XLSX.utils.aoa_to_sheet(tidRows);
    wsTid["!cols"] = [{ wch: 12 }, { wch: 10 }, { wch: 16 }, { wch: 20 }, { wch: 8 }, { wch: 10 }, { wch: 10 }, { wch: 11 }, { wch: 12 }, { wch: 30 }];
    XLSX.utils.book_append_sheet(wb, wsTid, "Timer");

    const udlaegRows = [
      ["Dato", "Kunde", "Kategori", "Beløb inkl. moms", "Moms", "Beløb ekskl. moms", "Kvittering", "Note"],
      ...udlaeg.sort((a, b) => (a.date < b.date ? -1 : 1)).map((e) => {
        const { net, vat, gross } = vatSplit(e.amount, e.vatRate ?? 25, e.vatIncl !== false);
        return [formatDateDK(e.date), customerName(e.customerId), e.category, Number(gross.toFixed(2)), Number(vat.toFixed(2)), Number(net.toFixed(2)), e.receiptImage ? "Ja" : "", e.note];
      }),
      [],
      [
        "", "", "I alt",
        Number(udlaeg.reduce((s, e) => s + vatSplit(e.amount, e.vatRate ?? 25, e.vatIncl !== false).gross, 0).toFixed(2)),
        Number(udlaeg.reduce((s, e) => s + vatSplit(e.amount, e.vatRate ?? 25, e.vatIncl !== false).vat, 0).toFixed(2)),
        Number(udlaeg.reduce((s, e) => s + vatSplit(e.amount, e.vatRate ?? 25, e.vatIncl !== false).net, 0).toFixed(2)),
        "", "",
      ],
    ];
    const wsUdlaeg = XLSX.utils.aoa_to_sheet(udlaegRows);
    wsUdlaeg["!cols"] = [{ wch: 12 }, { wch: 16 }, { wch: 14 }, { wch: 16 }, { wch: 10 }, { wch: 16 }, { wch: 10 }, { wch: 30 }];
    XLSX.utils.book_append_sheet(wb, wsUdlaeg, "Udlæg");

    if (personale.length > 0) {
      const personaleRows = [
        ["Dato", "Kunde", "Medarbejder", "Timer", "Timeløn", "Nattetimer", "Nattillæg/t", "Omkostning", "Note"],
        ...personale.sort((a, b) => (a.date < b.date ? -1 : 1)).map((e) => [
          formatDateDK(e.date), customerName(e.customerId), employeeName(e.employeeId), e.hours,
          e.hourlyWage || 0, e.nightHours || 0, e.nightRate || 0, Number(staffCost(e).toFixed(2)), e.note,
        ]),
        [],
        ["", "", "I alt", Number(personale.reduce((s, e) => s + e.hours, 0).toFixed(2)), "", "", "", Number(personale.reduce((s, e) => s + staffCost(e), 0).toFixed(2)), ""],
      ];
      const wsPersonale = XLSX.utils.aoa_to_sheet(personaleRows);
      wsPersonale["!cols"] = [{ wch: 12 }, { wch: 16 }, { wch: 16 }, { wch: 8 }, { wch: 10 }, { wch: 10 }, { wch: 11 }, { wch: 12 }, { wch: 30 }];
      XLSX.utils.book_append_sheet(wb, wsPersonale, "Medarbejdere");
    }

    const rangeLabel = exportFrom || exportTo ? `_${exportFrom || "start"}_til_${exportTo || "nu"}` : "";
    const filename = `Timeoversigt${rangeLabel}.xlsx`;

    setExportStatus("Klargør fil…");
    try {
      const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      const blob = new Blob([wbout], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const file = new File([blob], filename, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        setExportStatus("Delt.");
        return;
      }
      // Fallback: trigger a normal browser download
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      setExportStatus("Downloadet — tjek din browsers download-mappe eller Filer-app.");
    } catch (err) {
      if (err && err.name === "AbortError") {
        setExportStatus(null);
      } else {
        setExportStatus("Kunne ikke dele/downloade filen. Prøv igen, eller brug PDF-format i stedet.");
      }
    }
  }

  function exportPdf() {
    window.print();
  }


  return (
    <div className="min-h-screen bg-[#F5F5F7] text-[#1C1C1E] pb-36" style={{ fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" }}>

      <header className="no-print bg-white border-b border-[#E2E2E6] px-4 py-3 sticky top-0 z-10">

      </header>

      <main className="no-print max-w-lg mx-auto px-4 py-4 space-y-4">
        {page === "registrering" && (

                {saveStatus}

            {editingIds && (

            <div className="bg-white rounded-xl border border-[#E2E2E6] shadow-sm p-4 space-y-4">

                  <Field label="Kunde">
                    <div className="flex gap-2">
                      <select

                    </div>

                <Field label="Timesats">
                  <input type="text" inputMode="decimal" placeholder="0" value={draft.hourlyRate} onChange={(e) => setDraft({ ...draft, hourlyRate: e.target.value })} className={inputCls} />

                  <button

              {(draft.start || draft.manualH) && (

            </div>

            {/* Row 3: Arbejde og udlæg */}
            <div className="bg-white rounded-xl border border-[#E2E2E6] shadow-sm divide-y divide-[#E2E2E6] overflow-hidden">
              <button onClick={() => setShowJobsModal(true)} className="w-full flex items-center justify-between px-4 py-3.5">
                <span className="text-sm text-[#1C1C1E]">Fordel på jobs</span>
                <span className="flex items-center gap-2 text-xs text-[#8E8E93]">
                  {draft.jobs.filter((j) => j.project.trim()).length > 0 ? `${formatHours(jobsTotal)} t på ${draft.jobs.filter((j) => j.project.trim()).length} job` : "Ikke fordelt"}
                  <ChevronRight size={16} className="text-[#B4B4BA]" />

              </button>
              <button onClick={() => setShowStaffModal(true)} className="w-full flex items-center justify-between px-4 py-3.5">
                <span className="text-sm text-[#1C1C1E]">Medarbejdere</span>
                <span className="flex items-center gap-2 text-xs text-[#8E8E93]">
                  {draft.staff.filter((s) => s.employeeId).length > 0 ? `${formatHours(staffTotalDraft)} t på ${draft.staff.filter((s) => s.employeeId).length} medarbejder${draft.staff.filter((s) => s.employeeId).length > 1 ? "e" : ""}` : "Ingen tilføjet"}
                  <ChevronRight size={16} className="text-[#B4B4BA]" />
                </span>
              </button>
              <button onClick={() => setShowExpensesModal(true)} className="w-full flex items-center justify-between px-4 py-3.5">
                <span className="text-sm text-[#1C1C1E]">Udlæg</span>
                <span className="flex items-center gap-2 text-xs text-[#8E8E93]">
                  {validExpensesDraft.length > 0 ? `${formatDKK(expensesTotalDraft)} kr. på ${validExpensesDraft.length} udlæg` : "Ingen tilføjet"}
                  <ChevronRight size={16} className="text-[#B4B4BA]" />

              </button>
            </div>

            {/* Row 5: Note */}
            <div className="bg-white rounded-xl border border-[#E2E2E6] shadow-sm p-4">

              </Field>
            </div>
          </>
        )}

        {page === "arkiv" && (
          <>
            {archiveGroups.length === 0 ? (
              <p className="text-sm text-[#B4B4BA] italic px-1">Ingen registreringer endnu.</p>

              <div className="space-y-3">
                {archiveGroups.map((g) => {
                  const totalH = g.tid.reduce((s, e) => s + e.hours, 0);
                  const totalExp = g.udlaeg.reduce((s, e) => s + e.amount, 0);
                  const revenue = g.tid.reduce((s, e) => s + entryAmount(e), 0);
                  const staffTotal = g.personale.reduce((s, e) => s + staffCost(e), 0);
                  const hasNight = g.tid.some((e) => (e.nightHours || 0) > 0) || g.personale.some((e) => (e.nightHours || 0) > 0);
                  return (
                    <div key={g.date + g.customerId} className="bg-white rounded-xl border border-[#E2E2E6] overflow-hidden shadow-sm">
                      <div className="flex items-center justify-between px-4 py-2 bg-[#FAFAFB] border-b border-[#E2E2E6]">
                        <span className="text-sm font-medium">{formatDateDK(g.date)} <span className="text-[#8E8E93] font-normal">— {weekdayDK(g.date)}</span></span>
                        <span className="text-xs text-[#3FA9A4] flex items-center gap-1">
                          {customerName(g.customerId) || "Ingen kunde"}
                          {hasNight && <Moon size={12} />}
                        </span>
                      </div>
                      <div className="px-4 py-2.5 space-y-1">
                        {g.tid.map((e) => (
                          <div key={e.id} className="flex justify-between text-sm">

                    className="flex-1 rounded-lg px-3 py-2.5 text-sm font-medium border"
                    style={exportFormat === "numbers" ? { backgroundColor: "#3FA9A4", borderColor: "#3FA9A4", color: "#ffffff" } : { backgroundColor: "#F0F0F3", borderColor: "#E2E2E6", color: "#8E8E93" }}
                  >
                    Numbers
                  </button>
                  <button
                    onClick={() => setExportFormat("pdf")}
                    className="flex-1 rounded-lg px-3 py-2.5 text-sm font-medium border"
                    style={exportFormat === "pdf" ? { backgroundColor: "#3FA9A4", borderColor: "#3FA9A4", color: "#ffffff" } : { backgroundColor: "#F0F0F3", borderColor: "#E2E2E6", color: "#8E8E93" }}
                  >

              <Field label="Kunde">
                <select value={exportCustomer} onChange={(e) => setExportCustomer(e.target.value)} className={inputCls}>

                      </div>
                    ) : (
                      <label className="flex items-center justify-center w-full h-[42px] bg-[#F0F0F3] border border-dashed border-[#D0D0D6] rounded-lg text-[#8E8E93] cursor-pointer">
                        {uploadingReceipt === x.id ? <span className="text-[10px]">…</span> : <Camera size={16} />}
                        <input type="file" accept="image/*" capture="environment" className="hidden" onChange={(e) => handleReceiptSelect(x.id, e.target.files?.[0])} />
                      </label>
                    )}
                  </div>
                  <div className="flex items-center gap-2 flex-wrap">
                    <select value={x.vatRate} onChange={(e) => updateExpense(x.id, { vatRate: e.target.value })} className={inputCls + " w-20 shrink-0"}>
                      <option value="25">25%</option>
                      <option value="0">0%</option>
                    </select>
                    <label className="flex items-center gap-1.5 text-xs text-[#8E8E93] shrink-0">
                      <input type="checkbox" checked={x.vatIncl} onChange={(e) => updateExpense(x.id, { vatIncl: e.target.checked })} className="accent-[#3FA9A4]" />
                      Inkl. moms
                    </label>
                  </div>
                  <p className="text-xs text-[#8E8E93]">Uden moms: <span className="font-medium text-[#1C1C1E]">{formatDKK(net)} kr.</span></p>
                  <div className="flex items-center gap-2">
                    <input type="text" placeholder="Note (valgfrit)" value={x.note} onChange={(e) => updateExpense(x.id, { note: e.target.value })} className={inputCls} />
                    {draft.expenses.length > 1 && <button onClick={() => removeExpenseRow(x.id)} className="text-[#B4B4BA] hover:text-red-500 shrink-0"><Trash2 size={16} /></button>}
                  </div>
                </div>
              );
            })}
          </div>
          <button onClick={addExpenseRow} className="w-full flex items-center justify-center gap-2 text-sm text-[#3FA9A4] border border-dashed border-[#3FA9A4]/40 rounded-lg py-2.5">
            <Plus size={15} /> Tilføj udlæg
          </button>
        </ModalShell>
      )}

      {/* ---- Customer management modal ---- */}
      {showCustomerModal && (
        <ModalShell
          title="Kunder"
          onClose={() => setShowCustomerModal(false)}
          onSave={() => (customerForm.name.trim() ? saveCustomer() : setShowCustomerModal(false))}
          saveLabel={customerForm.name.trim() ? (editingCustomerId ? "Gem" : "Tilføj") : "Luk"}
        >
          {customers.length > 0 && (
            <div className="divide-y divide-[#E2E2E6] border border-[#E2E2E6] rounded-lg overflow-hidden">
              {customers.map((c) => (
                <div key={c.id} className="flex items-center gap-2 px-3 py-2.5">
                  <div className="flex-1">
                    <div className="text-sm font-medium">{c.name}</div>
                    <div className="text-xs text-[#8E8E93]">
                      {formatDKK(c.hourlyRate)} kr./t
                      {c.nightRate > 0 && <span> · +{formatDKK(c.nightRate)} kr./t nat</span>}
                    </div>
                  </div>
                  <button onClick={() => { setEditingCustomerId(c.id); setCustomerForm({ name: c.name, hourlyRate: String(c.hourlyRate), nightRate: String(c.nightRate || "") }); }} className="text-[#B4B4BA] hover:text-[#3FA9A4]"><Pencil size={14} /></button>
                  <button onClick={() => removeCustomer(c.id)} className="text-[#B4B4BA] hover:text-red-500"><Trash2 size={14} /></button>
                </div>
              ))}
            </div>
          )}
          <div className="border-t border-[#E2E2E6] pt-3 space-y-2">
            <p className="text-xs text-[#8E8E93]">{editingCustomerId ? "Rediger kunde" : "Ny kunde"}</p>
            <input
              type="text"
              placeholder="Kundenavn"
              value={customerForm.name}
              onChange={(e) => setCustomerForm({ ...customerForm, name: e.target.value })}
              onKeyDown={(e) => { if (e.key === "Enter") saveCustomer(); }}
              className={inputCls}
            />
            <div className="grid grid-cols-2 gap-2">
              <input
                type="text"
                inputMode="decimal"
                placeholder="Timesats (kr./t)"
                value={customerForm.hourlyRate}
                onChange={(e) => setCustomerForm({ ...customerForm, hourlyRate: e.target.value })}
                onKeyDown={(e) => { if (e.key === "Enter") saveCustomer(); }}
                className={inputCls}
              />
              <input
                type="text"
                inputMode="decimal"
                placeholder="Nattillæg (kr./t)"
                value={customerForm.nightRate}
                onChange={(e) => setCustomerForm({ ...customerForm, nightRate: e.target.value })}
                onKeyDown={(e) => { if (e.key === "Enter") saveCustomer(); }}
                className={inputCls}
              />
            </div>
            <button
              type="button"
              onClick={saveCustomer}
              style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, backgroundColor: "#3FA9A4", color: "#ffffff", borderRadius: 8, padding: "10px 16px", fontSize: 14, fontWeight: 600, border: "none" }}
            >
              {editingCustomerId ? <Check size={15} /> : <Plus size={15} />} {editingCustomerId ? "Gem ændring" : "Tilføj kunde"}
            </button>
          </div>
        </ModalShell>
      )}

      {lightboxImage && (
        <div onClick={() => setLightboxImage(null)} className="no-print fixed inset-0 bg-black/70 flex items-center justify-center p-6 z-50">
          <button onClick={() => setLightboxImage(null)} className="absolute top-5 right-5 text-white bg-black/40 rounded-full p-2"><X size={20} /></button>
          <img src={lightboxImage} alt="" onClick={(e) => e.stopPropagation()} className="max-w-full max-h-full rounded-lg" />
        </div>
      )}
    </div>
  );
}


createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
